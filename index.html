<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>Profilith — Infinite Profiles</title>
<meta name="description" content="Profilith: an endless stream of unique digital identities. Jump to any profile number, exactly.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2307070b%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2722%27 text-anchor=%27middle%27 fill=%27%23d9c28f%27 font-family=%27Georgia,serif%27 font-style=%27italic%27%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/profile/1" aria-label="Profilith, back to profile 1">Profilith</a>
    <form id="search" class="search" role="search" novalidate autocomplete="off">
      <label class="sr" for="q">Profile number</label>
      <input id="q" type="text" inputmode="numeric" enterkeyhint="go" spellcheck="false" autocapitalize="off" placeholder="Go to profile number" aria-describedby="msg">
      <button type="submit" class="btn primary">Go</button>
    </form>
    <div class="nav">
      <button id="prev" class="btn" type="button" aria-label="Previous profile">Previous</button>
      <button id="next" class="btn" type="button" aria-label="Next profile">Next</button>
      <button id="rand" class="btn" type="button">Random</button>
    </div>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </div>
</header>
<main>
  <div id="top" class="sentinel" aria-hidden="true"></div>
  <ol id="stream" class="stream" aria-label="Profile stream"></ol>
  <div id="bottom" class="sentinel" aria-hidden="true"></div>
</main>
<noscript><p style="padding:24px;text-align:center">Profilith needs JavaScript to generate its infinite stream.</p></noscript>
<script src="./script.js"></script>
</body>
</html>
